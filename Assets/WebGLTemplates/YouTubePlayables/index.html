<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- YouTube Playables SDK: must load before any game code. It is a no-op when the page runs outside YouTube. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #c7edd9; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; background: #c7edd9; }
      /* Same look as the game's Boot screen: bouncing mascots and a chunky striped pill bar. */
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
                 font: 800 30px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2f6f63;
                 background: linear-gradient(#d4f2e3, #b3e3cc); }
      #loading .title { font-size: clamp(34px, 9vw, 56px); letter-spacing: 0.5px; }
      #loading .title span { color: #f4806f; }
      #loading .mascots { display: flex; gap: clamp(8px, 3vw, 18px); height: 90px; align-items: flex-end; }
      #loading .mascots img { width: clamp(52px, 15vw, 76px); height: auto; animation: hop 0.9s ease-in-out infinite; }
      #loading .mascots img:nth-child(2) { animation-delay: 0.15s; }
      #loading .mascots img:nth-child(3) { animation-delay: 0.3s; }
      #loading .mascots img:nth-child(4) { animation-delay: 0.45s; }
      @keyframes hop { 0%, 100% { transform: translateY(0) scale(1.05, 0.92); } 45% { transform: translateY(-22px) scale(0.97, 1.04); } }
      #loading .bar { position: relative; width: min(78vw, 380px); height: 34px; padding: 6px; border-radius: 23px; background: #fffdf6;
                      box-shadow: 0 4px 0 rgba(47, 111, 99, 0.18); }
      #loading .track { position: relative; height: 100%; border-radius: 17px; background: rgba(47, 111, 99, 0.18); overflow: hidden; }
      #loading .fill { position: absolute; inset: 0 auto 0 0; width: 10%; min-width: 34px; border-radius: 17px; overflow: hidden;
                       background: #ffc23d repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.28) 0 12px, rgba(255, 255, 255, 0) 12px 24px);
                       background-size: 34px 34px; animation: stripes 0.8s linear infinite; transition: width 0.25s ease-out; }
      #loading .fill::after { content: ""; position: absolute; top: -10px; bottom: -10px; width: 26px; left: -40px;
                              background: rgba(255, 255, 255, 0.5); transform: skewX(-20deg); animation: shine 1.6s ease-in-out infinite; }
      @keyframes stripes { to { background-position: 34px 0; } }
      @keyframes shine { to { left: calc(100% + 40px); } }
      #loading .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2f6f63; }
      #loading .error { font-size: 16px; font-weight: 400; max-width: 80vw; text-align: center; }
      @media (prefers-reduced-motion: reduce) { #loading * { animation: none !important; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">Onet <span>Connect</span></div>
      <div class="mascots">
        <img src="TemplateData/panda.png" alt=""><img src="TemplateData/fox.png" alt=""><img src="TemplateData/chick.png" alt=""><img src="TemplateData/frog.png" alt="">
      </div>
      <div class="bar"><div class="track"><div class="fill" id="loading-fill"></div></div><div class="pct" id="loading-pct">0%</div></div>
    </div>
    <script>
      var yt = window.ytgame;
      // The loading screen above is in the page: tell YouTube the first frame is up. Sent synchronously (not on an
      // animation frame, which a hidden tab can delay) so it always precedes the game's loadData / gameReady calls.
      try { if (yt) yt.game.firstFrameReady(); } catch (e) { console.warn(e); }

      // Playables forbids preventDefault() on Esc, so keep Esc away from Unity's input handlers (registered later, so
      // this capture listener runs first) and hand it to the game through the bridge instead: it closes popups.
      window.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        e.stopImmediatePropagation();
        if (!e.repeat && window.ytpEscape) window.ytpEscape();
      }, true);

      var canvas = document.getElementById('unity-canvas');
      var loading = document.getElementById('loading');
      var fill = document.getElementById('loading-fill');
      var pct = document.getElementById('loading-pct');

      var loader = document.createElement('script');
      loader.src = 'Build/{{{ LOADER_FILENAME }}}';
      loader.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: 'Build/{{{ DATA_FILENAME }}}',
          frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
          codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
          streamingAssetsUrl: 'StreamingAssets',
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          // Sharp text on high-density phones without rendering 3x pixels.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        }, function (progress) {
          fill.style.width = (100 * progress) + '%';
          pct.textContent = Math.round(100 * progress) + '%';
        }).then(function () {
          // Unity's Boot scene now shows its own loading screen; gameReady is sent from C# once the board takes input.
          loading.remove();
        }).catch(function (message) {
          try { if (yt) yt.health.logError(); } catch (e) {}
          var err = document.createElement('div');
          err.className = 'error';
          err.textContent = 'Something went wrong while loading. Please try again.';
          loading.appendChild(err);
          console.error(message);
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
